name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag europe-west1-docker.pkg.dev/nexwork-75325/cloud-run-source-deploy/systro-live:latest .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy systro-live \
            --image europe-west1-docker.pkg.dev/nexwork-75325/cloud-run-source-deploy/systro-live:latest \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated
