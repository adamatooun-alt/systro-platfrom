    <!-- Suppress benign Vite HMR WebSocket warnings/errors in sandboxed dev environment -->
    <script>
      (function() {
        var originalError = console.error;
        var originalWarn = console.warn;
        
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(arg) {
            try { return String(arg); } catch(e) { return ''; }
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 || 
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          originalError.apply(console, arguments);
        };

        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(arg) {
            try { return String(arg); } catch(e) { return ''; }
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 || 
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          originalWarn.apply(console, arguments);
        };
      })();

      window.addEventListener('unhandledrejection', function(e) {
        var msg = String((e.reason && e.reason.message) || e.reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 || 
          msg.indexOf('websocket') !== -1 || 
          msg.indexOf('closed without opened') !== -1 || 
          msg.indexOf('failed to connect') !== -1
        ) {
          e.preventDefault();
          try { e.stopImmediatePropagation(); } catch(err) {}
        }
      });

      window.addEventListener('error', function(e) {
        var msg = String(e.message || '');
        if (
          msg.indexOf('WebSocket') !== -1 || 
          msg.indexOf('websocket') !== -1 || 
          msg.indexOf('closed without opened') !== -1 || 
          msg.indexOf('failed to connect') !== -1
        ) {
          e.preventDefault();
          try { e.stopImmediatePropagation(); } catch(err) {}
        }
      }, true);
    </script>

    <script>
      // Build version check for instant cache busting on published URL
      const CURRENT_BUILD_VER = 'systro_build_2026_08_11_v4';
      const storedVer = localStorage.getItem('systro_app_build_version');
      
      if (storedVer !== CURRENT_BUILD_VER) {
        localStorage.setItem('systro_app_build_version', CURRENT_BUILD_VER);
        if ('caches' in window) {
          caches.keys().then((keys) => {
            keys.forEach((key) => caches.delete(key));
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister());
          });
        }
      }

      // Force unregister all active service workers and clear caches on startup to completely solve PWA caching on the published URL
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          let unregisteredAny = false;
          for (const registration of registrations) {
            registration.unregister();
            unregisteredAny = true;
          }
          if (unregisteredAny && !sessionStorage.getItem('sw_purged_v4')) {
            sessionStorage.setItem('sw_purged_v4', 'true');
            setTimeout(() => {
              window.location.reload();
            }, 300);
          }
        }).catch((err) => {});
      }

      // Purge all cache storage to clear old index.html or JS/CSS chunks
      if ('caches' in window) {
        caches.keys().then((keys) => {
          let deletedAny = false;
          return Promise.all(
            keys.map((key) => {
              return caches.delete(key).then((success) => {
                if (success) deletedAny = true;
              });
            })
          ).then(() => {
            if (deletedAny && !sessionStorage.getItem('cache_purged_v4')) {
              sessionStorage.setItem('cache_purged_v4', 'true');
              setTimeout(() => {
                window.location.reload();
              }, 300);
            }
          });
        }).catch((err) => {});
      }
    </script>
