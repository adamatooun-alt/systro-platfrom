    <!-- Suppress benign Vite HMR WebSocket warnings/errors in sandboxed dev environment -->
    <script>
      (function() {
        var originalError = console.error;
        var originalWarn = console.warn;
        
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(arg) {
            try { return String(arg); } catch(e) { return ''; }
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 || 
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          originalError.apply(console, arguments);
        };

        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(arg) {
            try { return String(arg); } catch(e) { return ''; }
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 || 
            msg.indexOf('failed to connect') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          originalWarn.apply(console, arguments);
        };
      })();

      window.addEventListener('unhandledrejection', function(e) {
        var msg = String((e.reason && e.reason.message) || e.reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 || 
          msg.indexOf('websocket') !== -1 || 
          msg.indexOf('closed without opened') !== -1 || 
          msg.indexOf('failed to connect') !== -1
        ) {
          e.preventDefault();
          try { e.stopImmediatePropagation(); } catch(err) {}
        }
      });

      window.addEventListener('error', function(e) {
        var msg = String(e.message || '');
        if (
          msg.indexOf('WebSocket') !== -1 || 
          msg.indexOf('websocket') !== -1 || 
          msg.indexOf('closed without opened') !== -1 || 
          msg.indexOf('failed to connect') !== -1
        ) {
          e.preventDefault();
          try { e.stopImmediatePropagation(); } catch(err) {}
        }
      }, true);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('Systro PWA ServiceWorker registered successfully: ', reg.scope);
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
