<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Vibrant Cyan-Blue Aqua) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>

    <!-- Top Ribbon Gradient -->
    <linearGradient id="ribbonTopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="50%" stop-color="#92FE9D" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>

    <!-- Main Ribbon 3D S Gradient -->
    <linearGradient id="sRibbonMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="30%" stop-color="#80DEEA" />
      <stop offset="70%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Bottom Ribbon Loop Gradient -->
    <linearGradient id="ribbonBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#03256C" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Particle Glow -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)" />

  <!-- Subtle Radial Inner Highlight -->
  <circle cx="180" cy="140" r="220" fill="#FFFFFF" opacity="0.15" />

  <!-- Glowing Stream Network Lines (Background Particles) -->
  <g opacity="0.65" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round">
    <path d="M 120 280 C 180 320, 240 330, 320 290" />
    <path d="M 150 250 C 220 290, 280 280, 360 220" />
    <path d="M 190 200 C 260 210, 310 180, 390 130" />
  </g>

  <!-- Floating Tech Nodes & Bubbles (Glowing Orbs) -->
  <g filter="url(#dotGlow)">
    <!-- Top right orb cluster -->
    <circle cx="390" cy="130" r="9" fill="#FFFFFF" />
    <circle cx="350" cy="155" r="6" fill="#E0F7FA" opacity="0.9" />
    <circle cx="410" cy="160" r="7" fill="#80DEEA" opacity="0.8" />
    <circle cx="320" cy="120" r="4" fill="#FFFFFF" opacity="0.7" />

    <!-- Bottom left orb cluster -->
    <circle cx="120" cy="280" r="8" fill="#FFFFFF" />
    <circle cx="150" cy="250" r="5" fill="#E0F7FA" opacity="0.9" />
    <circle cx="170" cy="310" r="6" fill="#80DEEA" opacity="0.85" />
    <circle cx="190" cy="200" r="4" fill="#FFFFFF" opacity="0.75" />

    <!-- Ambient floating sparkles -->
    <circle cx="130" cy="160" r="5" fill="#FFFFFF" opacity="0.6" />
    <circle cx="380" cy="320" r="6" fill="#80DEEA" opacity="0.6" />
    <circle cx="280" cy="370" r="4" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- 3D Fluid Ribbon "S" Mark -->
  <g filter="url(#glowFilter)">
    <!-- Bottom Under-Loop of S -->
    <path d="M 170 285 
             C 210 375, 340 380, 380 325 
             C 410 280, 350 240, 260 240 
             C 180 240, 140 280, 170 285 Z" 
          fill="url(#ribbonBottomGrad)" opacity="0.9" />

    <!-- Main Dynamic 3D Ribbon S Body -->
    <path d="M 170 190 
             C 170 140, 240 100, 320 115 
             C 380 125, 410 160, 380 185 
             C 330 220, 240 215, 180 250 
             C 130 280, 140 340, 220 370 
             C 300 400, 390 350, 420 280 
             C 390 330, 300 370, 220 350 
             C 160 335, 160 290, 200 270 
             C 270 235, 380 230, 400 170 
             C 415 125, 350 90, 280 95 
             C 200 100, 150 145, 170 190 Z" 
          fill="url(#sRibbonMain)" />

    <!-- Top Highlight Fold Layer of S -->
    <path d="M 280 95 
             C 340 95, 400 125, 380 175 
             C 365 210, 290 225, 200 255 
             C 280 220, 360 200, 370 165 
             C 380 125, 330 105, 280 95 Z" 
          fill="url(#ribbonTopGrad)" opacity="0.95" />

    <!-- Crisp High-Light Rim Stroke -->
    <path d="M 175 185 C 200 120, 310 95, 375 130" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 180 250 C 260 220, 370 215, 400 170" 
          stroke="#E0F7FA" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>
</svg>
