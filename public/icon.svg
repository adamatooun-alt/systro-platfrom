<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Royal Blue Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Dashed Circular Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-dasharray="26 14" opacity="0.95" />

  <!-- Inner Blue Dash Accent Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Central Shield & Lightning Bolt -->
  <g transform="translate(116, 96) scale(0.55)" filter="url(#glowFilter)">
    <!-- Golden Shield -->
    <path d="M256 32 L420 96 V224 C420 340 336 438 256 480 C176 438 92 340 92 224 V96 L256 32 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="12" />
    <!-- Lightning Bolt Cutout inside Shield -->
    <path d="M275 110 L165 270 H260 L235 410 L345 250 H250 L275 110 Z" fill="#0d1b3e" stroke="#070c1e" stroke-width="3" />
  </g>
</svg>
